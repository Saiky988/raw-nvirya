[General]
dns-server = 1.1.1.1, 8.8.8.8
doh-server = https://1.1.1.1/dns-query, https://dns.google/dns-query
fallback-dns-server = 9.9.9.9, 1.1.1.1
doh-format = wireformat

[MITM]
enable = true
hostname = %APPEND% link4m.com, *.link4m.com, link4m.net, *.link4m.net, link4m.org, *.link4m.org, *.link4m.app

[Script]
Nvirya-Link4M = type=http-response,pattern=^https?:\/\/(?:[a-zA-Z0-9-]+\.)?link4m\.(?:com|net|org)\/.*,script-path=https://raw.nvirya.com/link4m/link4m-inject.js,requires-body=true,max-size=3145728

[Rule]
DOMAIN,raw.nvirya.com,DIRECT
URL-REGEX,^https?:\/\/(?:[a-zA-Z0-9-]+\.)?link4m\.(?:com|net|org)\/.*service-worker.*\.js,REJECT
FINAL,DIRECT
